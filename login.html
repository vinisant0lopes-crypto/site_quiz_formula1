<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quiz Formula 1</title>
    <link rel="stylesheet" href="./src/style/style.css">
    <link rel="stylesheet" href="./src/style/login.css">
    <link rel="icon" type="image/png" href="src/img//logo_site.png">
</head>
<body>
    <div class="nav">
        <div class="logo">  
            <img class="img_logo" src="./src/img/logo_site.png" alt="Logo do site">
        </div>
        <div class="links">
            <a href="index.html">Início</a>
            <a href="estatisticas.html">Estatísticas</a>
            <a href="sobre.html">Sobre</a>
            <a href="login.html">Logar</a>
        </div>
    </div>

    <main class="login-page">
        <section class="login-card">
            <p class="login-card__eyebrow">Acesso ao quiz</p>
            <h1 class="login-card__title">F1 QUIZ</h1>
            <p class="login-card__text">Antes de tudo, precisamos que você coloque as informações de sua conta para começar.</p>
            
            <form class="login-form" id="login-form">
                <div class="form-group">
                    <input type="text" class="form-input" placeholder="Nome" required id="nome-input">
                </div>
                <div class="form-group">
                    <input type="email" class="form-input" placeholder="Email" required id="email-input">
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" placeholder="Senha" required id="senha-input">
                </div>
                <button type="submit" class="btn-submit">COMEÇAR</button>
            </form>

            <a class="login-card__back" href="./index.html">< Voltar para a página inicial</a>
        </section>
    </main>

            <script src="./src/js/armazenar.js"></script>
    <script src="./src/js/login.js"></script>
</body>
</html>
